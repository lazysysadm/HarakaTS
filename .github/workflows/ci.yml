name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cœur headless : crypto, coffre, export/import — dont le critère n°1 (A → B).
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (core)
        run: cargo clippy -p haraka-core --all-targets -- -D warnings
      - name: tests normatifs (round-trip A→B, falsification, AAD, permissions)
        run: cargo test -p haraka-core
      - uses: taiki-e/install-action@cargo-audit
      - name: audit
        run: cargo audit
      - uses: taiki-e/install-action@cargo-deny
      - name: "garde-fou licences (MIT : permissif uniquement, pas de GPL/AGPL)"
        run: cargo deny check licenses

  # Application complète + paquets .deb / .rpm (baseline Debian 12 / Ubuntu 22.04).
  app:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: dépendances système (webkit2gtk 4.1, GTK, dbus, rpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libvte-2.91-dev librsvg2-dev libdbus-1-dev rpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        # version lue depuis packageManager (pnpm@12.21.0) dans package.json
      - name: versions alignées (Cargo.toml = package.json = tauri.conf.json)
        run: cargo run -p xtask -- version check
      - name: icônes + fixtures du format v1
        run: cargo run -p xtask -- all
      - name: "install UI + build (requis avant clippy/tests : generate_context! embarque ui/dist)"
        run: |
          pnpm install
          pnpm --dir ui install
          pnpm --dir ui build
      - uses: taiki-e/install-action@cargo-about
      - name: avis de licences tierces (THIRD-PARTY-LICENSES.md, embarqué + bundlé)
        run: cargo run -p xtask -- licenses
      - name: clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: sshd de test (interop openssh)
        run: sudo bash crates/haraka-ssh/tests/sshd/setup.sh
      - name: tests workspace
        env:
          HARAKA_SSHD_TEST: "1"
          HARAKA_TEST_KEY: ${{ github.workspace }}/crates/haraka-ssh/tests/sshd/run/client_ed25519
          HARAKA_TEST_USER: harakats-test
          HARAKA_TEST_PORT: "2222"
        # Root, comme en local : les tests créent des dossiers « distants » dans /home/harakats-test.
        run: |
          sudo -E env "PATH=$PATH" "HOME=$HOME" cargo test --workspace
          sudo chown -R "$USER" target "$HOME/.cargo" || true
      - name: audit des dépendances JS (production, niveau élevé)
        run: pnpm --dir ui audit --prod --audit-level=high
      - name: lint + types + tests UI
        run: |
          pnpm --dir ui lint
          pnpm --dir ui check
          pnpm --dir ui test
      - name: build .deb + .rpm
        run: pnpm tauri build --bundles deb,rpm
      - name: paquets — métadonnées et dépendances (vérifiées, pas supposées)
        run: |
          set -e
          rpm -qp --requires target/release/bundle/rpm/*.rpm | tee /tmp/rpm-requires.txt
          grep -q '^vte291' /tmp/rpm-requires.txt
          grep -q '^webkit2gtk4.1' /tmp/rpm-requires.txt
          test "$(rpm -qp --queryformat '%{LICENSE}' target/release/bundle/rpm/*.rpm)" = "MIT"
          dpkg-deb -I target/release/bundle/deb/*.deb | tee /tmp/deb-info.txt
          grep -q 'libvte-2.91-0' /tmp/deb-info.txt
          rpm -qpl target/release/bundle/rpm/*.rpm | grep -q '/usr/bin/harakats'
          rpm -qpl target/release/bundle/rpm/*.rpm | grep -q '\.desktop$'
      - uses: actions/upload-artifact@v4
        with:
          name: harakats-paquets
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
