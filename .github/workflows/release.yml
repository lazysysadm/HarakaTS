name: Release

# Builds the .deb and .rpm packages for a version tag and attaches them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libvte-2.91-dev librsvg2-dev libdbus-1-dev rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - name: tag matches the project version
        run: |
          cargo run -p xtask -- version check
          want="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          test "$want" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != ${want}"; exit 1; }
      - name: icons and fixtures
        run: cargo run -p xtask -- all
      - name: install and build UI
        run: |
          pnpm install
          pnpm --dir ui install
          pnpm --dir ui build
      - uses: taiki-e/install-action@cargo-about
      - name: third-party licenses
        run: cargo run -p xtask -- licenses
      - name: build .deb and .rpm
        run: pnpm tauri build --bundles deb,rpm
      - name: checksums
        run: |
          cd target/release/bundle
          sha256sum deb/*.deb rpm/*.rpm | sed 's#  \(deb\|rpm\)/#  #' > ../../../SHA256SUMS
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "HarakaTS ${GITHUB_REF_NAME}" \
            --generate-notes target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm SHA256SUMS
