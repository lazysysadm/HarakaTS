[workspace]
resolver = "2"
members = ["crates/haraka-core", "crates/haraka-ssh", "src-tauri", "xtask"]

[workspace.package]
version = "1.0.9"
authors = ["LazySysAdmin"]
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
secrecy = "0.10"
zeroize = "1.9"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = "s"
