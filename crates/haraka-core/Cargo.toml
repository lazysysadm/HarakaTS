[package]
name = "haraka-core"
description = "Coffre chiffré portable, modèle de connexions, export/import — cœur headless de HarakaTS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
regex = "1"
argon2 = "0.6"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
rand = { version = "0.10", features = ["sys_rng"] }
secrecy.workspace = true
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
base64.workspace = true
chrono.workspace = true
tracing.workspace = true
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.2", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
tempfile = "3"
